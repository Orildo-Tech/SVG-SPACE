        <ul>
          <li><strong>1. Upload:</strong> Submit single SVGs or multi-variant icon packs (Mono, Default, Dark, Light, Wordmark).</li>
          <li><strong>2. Publish:</strong> 7-minute ingestion pipeline validates viewBoxes, sanitizes XML, and provisions permanent shareable pages.</li>
          <li><strong>3. Install:</strong> Install any icon into your codebase via <code>npx @orildo/icons add &lt;slug&gt;</code> or access direct CDN links.</li>
          <li><strong>4. Integrate:</strong> 1-click copyable components for React JSX, React Native, Next.js, Vue 3, Svelte, and HTML.</li>
