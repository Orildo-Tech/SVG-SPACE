version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Orildo-Tech"
    assignees:
      - "Orildo-Tech"
    commit-message:
      prefix: "chore"
      include: "scope:"
    labels:
      - "dependencies"
      - "npm"
    versioning-strategy: increase
    ignore:
      - dependency-name: "react"
        versions: ["18.3.1"]
      - dependency-name: "react-dom"
        versions: ["18.3.1"]
      - dependency-name: "vite"
        versions: ["6.1.0"]
    groups:
      react-dependencies:
        patterns:
          - "react*"
        exclude-patterns:
          - "react-dom"
      build-tools:
        patterns:
          - "vite*"
          - "@vitejs/*"
      ui-libraries:
        patterns:
          - "@hummingbirdui/*"
          - "tailwindcss*"
          - "lucide-react"
      utilities:
        patterns:
          - "file-saver"
          - "jszip"
          - "fuse.js"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-streams-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

commit-message:
  prefix: "chore"
  include: "scope:"
  prefixes:
    "chore": "Chore/Dependencies"
    "fix": "Fix/Dependencies"
    "docs": "Docs/Dependencies"
    "style": "Style/Dependencies"
  suffix: ""
  separate-prefix-edge: true
  separate-prefix-latest: false
